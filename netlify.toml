[build]
  publish = "."

[[redirects]]
  from = "/contact.html"
  to = "/contact.html"
  status = 200

[forms]
  # Netlify Forms processes submissions from data-netlify="true" forms automatically

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
